name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Arthur02-01&show_icons=true&theme=nightowl&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Arthur02-01&layout=compact&theme=nightowl&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Show generated stats
        run: |
          echo "===== STATS ====="
          grep -o "Total Commits[^<]*" profile/stats.svg || true

          echo "===== CHANGES ====="
          git diff -- profile/stats.svg profile/top-langs.svg || true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas estatísticas."
            exit 0
          fi

          git commit -m "Update README cards"
          git push
